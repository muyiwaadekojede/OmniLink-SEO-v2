[project]
name = "omnilink-seo-v2"
version = "2.0.0"
description = "OmniLink SEO v2: Enterprise-grade Internal & External Link Optimization Engine — PageRank, HITS, Topic Silos, BM25F, LinkBERT NLP, E-E-A-T Citations & Google Search Console Intelligence"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Muyiwa Adekojede", email = "muyiwaadekojede@gmail.com" },
  { name = "Dan Petrovic", email = "dan@dejanmarketing.com" }
]
keywords = [
  "seo",
  "internal-links",
  "internal-linking",
  "external-links",
  "link-building",
  "link-graph",
  "pagerank",
  "hits",
  "bm25f",
  "graph-theory",
  "nlp",
  "linkbert",
  "eeat",
  "google-search-console",
  "technical-seo"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12"
]
dependencies = [
  "torch",
  "transformers",
  "sentence-transformers",
  "beautifulsoup4",
  "lxml",
  "requests",
  "numpy",
  "openpyxl"
]

[project.urls]
Homepage = "https://github.com/muyiwaadekojede/OmniLink-SEO-v2"
Repository = "https://github.com/muyiwaadekojede/OmniLink-SEO-v2"
"LinkBERT Neural Component" = "https://huggingface.co/dejanseo/LinkBERT"
"Original LinkBERT Creator" = "https://dejanmarketing.com"

[project.scripts]
omnilink = "lb.cli:main"
linkbert = "lb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lb"]
